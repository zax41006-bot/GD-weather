name: 每小时更新广东天气图

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装系统级地理依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin libgdal-dev

      - name: 3. 安装中文字体
        run: |
          sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei

      - name: 4. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 5. 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 6. 运行天气脚本
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python main.py

      - name: 7. 自动提交更新后的图片
        run: |
          if [ ! -f "guangdong_temp_latest.png" ]; then
            echo "未找到 guangdong_temp_latest.png，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guangdong_temp_latest.png
          git diff --cached --quiet || git commit -m "chore: auto-update weather map [skip ci]"
          git push
