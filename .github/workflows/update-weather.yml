name: 每小时更新广东天气图

on:
  workflow_dispatch: # 关键：允许外部 API（cron-job.org）或手动触发

permissions:
  contents: write # 允许 Action 把生成的图片提交回仓库

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装系统级地理依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin libgdal-dev

      - name: 3. 安装中文字体（防止图中文字变方块）
        run: |
          sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei

      - name: 4. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 5. 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 6. 运行你的天气脚本
        run: python your_script_name.py  # ← 替换为你的 .py 文件名，例如 gd_weather.py

      - name: 7. 自动提交更新后的图片
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guangdong_temp_latest.png  # 脚本中保存的图片文件名
          git diff --cached --quiet || git commit -m "chore: auto-update weather map [skip ci]"
          git push
